# 单容器部署：前端已打包进 Go 二进制，只跑这一个服务；Navidrome 走外部地址。
# 全部数据在 ./data（secret.key、audio/、covers/），备份复制该目录即可。
#
# 使用前：
#   cp .env.example .env                          # 按需修改端口、Navidrome 地址
#   mkdir -p data && sudo chown 1000:1000 data    # 容器以 uid 1000 运行，需能写入
#   docker compose up -d --build
#
# 访问：http://主机IP:${SM_PORT}

services:
  simplemusic:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        REGISTRY: ${SM_REGISTRY:-docker.m.daocloud.io/library}
    image: simplemusic:latest
    container_name: simplemusic
    restart: unless-stopped
    ports:
      - "${SM_PORT:-9003}:8080"
    environment:
      SM_LISTEN: ":8080"
      SM_DATA_DIR: /app/data
      SM_NAVIDROME_URL: ${SM_NAVIDROME_URL:-}
      SM_MAX_BITRATE: ${SM_MAX_BITRATE:-192}
      SM_CACHE_MB: ${SM_CACHE_MB:-2048}
      SM_SECRET: ${SM_SECRET:-}
    volumes:
      - ./data:/app/data
    # Navidrome 跑在宿主机上时，可用 http://host.docker.internal:4533 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
